<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8f0f5"/>
      <stop offset="100%" stop-color="#b8e4ec"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3aadab"/>
      <stop offset="100%" stop-color="#5ec4c2"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="920" cy="80" r="120" fill="#3aadab" opacity="0.08"/>
  <circle cx="80" cy="420" r="90" fill="#f5a623" opacity="0.1"/>
  <!-- Accent bar -->
  <rect x="0" y="468" width="1024" height="32" fill="url(#accent)"/>
  <!-- Tomato mascot -->
  <g transform="translate(680 70) scale(4.2)">
    <rect x="30" y="10" width="4" height="7" rx="2" fill="#3aadab"/>
    <path d="M32 12 C26 4 14 8 18 16 C22 14 28 14 32 12Z" fill="#3aadab"/>
    <path d="M32 12 C38 4 50 8 46 16 C42 14 36 14 32 12Z" fill="#5ec4c2"/>
    <ellipse cx="32" cy="38" rx="24" ry="22" fill="#e8890c"/>
    <ellipse cx="32" cy="36" rx="22" ry="20" fill="#f5a623"/>
    <ellipse cx="24" cy="30" rx="8" ry="6" fill="#ffd56a" opacity="0.45"/>
    <ellipse cx="16" cy="40" rx="5" ry="3.5" fill="#ffb74d" opacity="0.55"/>
    <ellipse cx="48" cy="40" rx="5" ry="3.5" fill="#ffb74d" opacity="0.55"/>
    <ellipse cx="22" cy="34" rx="3.5" ry="4" fill="#3d4f5f"/>
    <ellipse cx="42" cy="34" rx="3.5" ry="4" fill="#3d4f5f"/>
    <circle cx="23.2" cy="32.5" r="1.2" fill="white"/>
    <circle cx="43.2" cy="32.5" r="1.2" fill="white"/>
    <path d="M22 46 Q32 54 42 46" fill="none" stroke="#3d4f5f" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Session track preview -->
  <g transform="translate(80 300)">
    <rect x="0" y="0" width="520" height="8" rx="4" fill="#3aadab" opacity="0.25"/>
    <rect x="0" y="0" width="380" height="8" rx="4" fill="#3aadab"/>
    <circle cx="380" cy="4" r="14" fill="#f5a623" stroke="#e8890c" stroke-width="2"/>
    <text x="0" y="36" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#3aadab">I</text>
    <text x="130" y="36" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#3d4f5f" opacity="0.4">II</text>
    <text x="260" y="36" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#3d4f5f" opacity="0.4">III</text>
    <text x="390" y="36" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#3d4f5f" opacity="0.4">IV</text>
  </g>
  <!-- Title -->
  <text x="80" y="120" font-family="system-ui,Segoe UI,sans-serif" font-size="72" font-weight="800" fill="#3d4f5f" letter-spacing="4">TOMATO TIME</text>
  <text x="80" y="175" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="600" fill="#3aadab">Focus is a journey.</text>
  <text x="80" y="230" font-family="system-ui,Segoe UI,sans-serif" font-size="22" fill="#3d4f5f" opacity="0.75">4 sessions &#183; 25 minutes &#183; One harvest</text>
  <text x="80" y="400" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#3d4f5f" opacity="0.5">Studio 9</text>
</svg>
